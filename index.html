<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wellspring Academic Week Calendar 2026–27</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#1d2733}.wrap{max-width:1400px;margin:auto;padding:18px}.top{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}.now{background:#123a55;color:white;padding:16px 20px;border-radius:10px;flex:1;min-width:320px}.now small{display:block;text-transform:uppercase;letter-spacing:.08em}.now strong{display:block;font-size:34px;margin:4px 0}.controls{background:white;border:1px solid #d6dde4;padding:12px;border-radius:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit;padding:8px;border:1px solid #bcc6d0;border-radius:6px;background:white}button{cursor:pointer}h1{font-size:34px;margin:8px 0 10px}.grid{display:grid;grid-template-columns:145px repeat(7,1fr);background:white;border:1px solid #d6dde4}.head{font-weight:700;text-align:center;background:#eef2f5;padding:9px;border-right:1px solid #d6dde4;border-bottom:1px solid #d6dde4}.week{background:#123a55;color:white;padding:12px;border-right:1px solid #d6dde4;border-bottom:1px solid #d6dde4}.week b{font-size:23px;display:block}.week span{font-size:12px}.day{min-height:126px;padding:8px;border-right:1px solid #d6dde4;border-bottom:1px solid #d6dde4}.other{background:#fafbfc;color:#9aa3ad}.today{outline:4px solid #0f5f7a;outline-offset:-4px}.date{font-size:18px;font-weight:800;margin-bottom:5px}.ev{font-size:12px;line-height:1.2;padding:4px 5px;border-radius:4px;margin:4px 0}.holiday{background:#e4e7eb}.exam{background:#ffe0cc}.map{background:#fff1a8}.event{background:#dceeff}.course{background:#e7f4e4}.deadline{background:#f6d5dc;font-weight:700}.legend{margin-top:10px;font-size:12px;color:#687483}dialog{border:none;border-radius:10px;box-shadow:0 15px 60px #0004;width:min(520px,92%)}.formrow{margin:10px 0}label{font-weight:700;font-size:13px;display:block;margin-bottom:4px}dialog input,dialog select{width:100%}.buttons{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}@media print{.controls,.legend{display:none}.wrap{padding:0}.now{border-radius:0}@page{size:A4 landscape;margin:7mm}}</style></head><body><div class="wrap"><div class="top"><div class="now" id="now"></div><div class="controls"><button onclick="move(-1)">Previous</button><select id="monthSel" onchange="idx=+this.value;render()"></select><button onclick="move(1)">Next</button><button onclick="window.print()">Print</button><button onclick="exportData()">Export data</button><button onclick="document.getElementById('imp').click()">Import data</button><input id="imp" type="file" accept=".json" hidden onchange="importData(this.files[0])"></div></div><h1 id="title"></h1><div class="grid" id="grid"></div><div class="legend">Grey = holiday/break · Orange = exams · Yellow = MAP/testing · Blue = school event · Green = course item · Pink = deadline</div></div><dialog id="dlg"><form method="dialog" id="form"><h2 id="dlgTitle"></h2><div class="formrow"><label>Item</label><input id="txt" required placeholder="e.g. Unit 2 test"></div><div class="formrow"><label>Type</label><select id="typ"><option value="course">Course item</option><option value="deadline">Deadline</option><option value="event">School event</option><option value="exam">Exam window</option><option value="map">MAP/testing</option><option value="holiday">Holiday/break</option></select></div><div class="formrow"><label>Course / label</label><input id="course" placeholder="GE B2, Pre-AP, Debate, School"></div><div class="buttons"><button value="cancel">Cancel</button><button type="button" onclick="delDate()">Delete date items</button><button value="save">Save</button></div></form></dialog><script>
const start=new Date(2026,7,3),months=[[2026,7],[2026,8],[2026,9],[2026,10],[2026,11],[2027,0],[2027,1],[2027,2],[2027,3],[2027,4]],names=['January','February','March','April','May','June','July','August','September','October','November','December'],key='wellspringAcademicClock2627';
const seed={'2026-08-03':[{text:'Students return / Start New School Year Week',type:'event',course:'School'}],'2026-08-24':[{text:'MAP testing begins',type:'map',course:'School'}],'2026-08-29':[{text:'Independence Day break',type:'holiday',course:'School'}],'2026-09-02':[{text:'Independence Day break ends',type:'holiday',course:'School'}],'2026-09-04':[{text:'Opening ceremony',type:'event',course:'School'}],'2026-09-11':[{text:'MAP testing ends',type:'map',course:'School'}],'2026-09-25':[{text:'Mid-Autumn Festival',type:'event',course:'School'}],'2026-10-05':[{text:"World Teachers' Day holiday",type:'holiday',course:'School'}],'2026-10-06':[{text:'Mid-semester I exams begin',type:'exam',course:'School'}],'2026-10-15':[{text:'Gradebooks and midterm reports due',type:'deadline',course:'School'}],'2026-10-16':[{text:'Mid-semester I exams end',type:'exam',course:'School'}],'2026-10-24':[{text:'Parent-teacher meetings',type:'event',course:'School'}],'2026-10-30':[{text:'Halloween / International Culture Day',type:'event',course:'School'}],'2026-11-23':[{text:"Vietnamese Teachers' Day holiday",type:'holiday',course:'School'}],'2026-11-24':[{text:'Vietnamese Cultural Day holiday',type:'holiday',course:'School'}],'2026-12-01':[{text:'Semester I exams begin',type:'exam',course:'School'}],'2026-12-14':[{text:'Semester I exams end',type:'exam',course:'School'}],'2026-12-24':[{text:'Winter break begins',type:'holiday',course:'School'}],'2027-01-04':[{text:'Students return',type:'event',course:'School'}],'2027-02-01':[{text:'Lunar New Year holiday begins',type:'holiday',course:'School'}],'2027-02-13':[{text:'Lunar New Year holiday ends',type:'holiday',course:'School'}],'2027-02-15':[{text:'Students return',type:'event',course:'School'}],'2027-03-08':[{text:'Mid-semester II exams begin',type:'exam',course:'School'}],'2027-03-19':[{text:'Mid-semester II exams end',type:'exam',course:'School'}],'2027-03-29':[{text:'MAP testing begins',type:'map',course:'School'}],'2027-04-09':[{text:'MAP testing ends',type:'map',course:'School'}],'2027-04-16':[{text:"Hung Kings' Day holiday",type:'holiday',course:'School'}],'2027-04-30':[{text:'Reunification Day',type:'holiday',course:'School'}],'2027-05-01':[{text:'International Labor Day',type:'holiday',course:'School'}],'2027-05-04':[{text:'Semester II exams begin',type:'exam',course:'School'}],'2027-05-15':[{text:'Semester II exams end',type:'exam',course:'School'}],'2027-05-25':[{text:'Honor and closing ceremony',type:'event',course:'School'}],'2027-05-27':[{text:'Grade 9 graduation and parent meeting',type:'event',course:'School'}],'2027-05-29':[{text:'Student summer holiday begins',type:'holiday',course:'School'}]};
let data=JSON.parse(localStorage.getItem(key)||'null')||seed,idx=months.findIndex(([y,m])=>y===new Date().getFullYear()&&m===new Date().getMonth());if(idx<0)idx=1;let selected=null;
function save(){localStorage.setItem(key,JSON.stringify(data))}function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function mon(d){let x=new Date(d),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);x.setHours(0,0,0,0);return x}function wk(d){return Math.floor((mon(d)-start)/604800000)+1}function range(m){let s=new Date(m);s.setDate(s.getDate()+6);return m.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' – '+s.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function renderNow(){let n=new Date(),w=wk(n),m=mon(n);document.getElementById('now').innerHTML='<small>NOW</small><strong>ACADEMIC WEEK '+w+'</strong><div>'+range(m)+'</div>'}function buildSelect(){let s=document.getElementById('monthSel');s.innerHTML='';months.forEach(([y,m],i)=>{let o=document.createElement('option');o.value=i;o.textContent=names[m]+' '+y;o.selected=i===idx;s.appendChild(o)})}
function render(){buildSelect();let[y,m]=months[idx];document.getElementById('title').textContent=names[m]+' '+y;let g=document.getElementById('grid');g.innerHTML='';['Academic week','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].forEach(x=>{let h=document.createElement('div');h.className='head';h.textContent=x;g.appendChild(h)});let first=new Date(y,m,1),last=new Date(y,m+1,0),a=mon(first),z=mon(last);z.setDate(z.getDate()+6);for(let wday=new Date(a);wday<=z;wday.setDate(wday.getDate()+7)){let wc=document.createElement('div');wc.className='week';wc.innerHTML='<b>WEEK '+wk(wday)+'</b><span>'+range(wday)+'</span>';g.appendChild(wc);for(let j=0;j<7;j++){let d=new Date(wday);d.setDate(wday.getDate()+j);let c=document.createElement('div');c.className='day'+(d.getMonth()!==m?' other':'');if(d.toDateString()===new Date().toDateString())c.classList.add('today');let k=iso(d);c.innerHTML='<div class="date">'+d.getDate()+'</div>';(data[k]||[]).forEach(e=>{let x=document.createElement('div');x.className='ev '+e.type;x.textContent=(e.course?e.course+': ':'')+e.text;c.appendChild(x)});c.onclick=()=>openDlg(k);g.appendChild(c)}}}
function move(n){idx=Math.max(0,Math.min(months.length-1,idx+n));render()}function openDlg(k){selected=k;document.getElementById('dlgTitle').textContent=new Date(k+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});txt.value='';typ.value='course';course.value='';dlg.showModal()}form.addEventListener('submit',e=>{if(e.submitter.value==='cancel')return;let t=txt.value.trim();if(!t)return;if(!data[selected])data[selected]=[];data[selected].push({text:t,type:typ.value,course:course.value.trim()});save();render()});function delDate(){if(confirm('Delete all items on this date?')){delete data[selected];save();dlg.close();render()}}function exportData(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='wellspring-calendar-data.json';a.click()}function importData(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();render();alert('Imported.')}catch{alert('Invalid JSON file.')}};r.readAsText(f)}renderNow();render();
</script></body></html>
